# Planner Contract — YAML Schema
# Contract: contract.planner v1.0.0
# See: contracts/planner.contract.md

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://aos.platform/schemas/planner.schema.yaml"
title: PlannerContract
type: object
additionalProperties: false
required:
  - planner_id
  - version
  - goal
  - objective
  - task
  - sub_task
  - dependency
  - priority
  - constraints
  - execution_plan
  - success_criteria
  - failure_criteria
  - model_ref
  - max_replan_attempts
  - status
properties:
  planner_id:
    type: string
    pattern: "^planner\\.[a-z][a-z0-9_]*$"
  version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
  goal:
    type: string
    minLength: 1
  objective:
    type: object
    required: [metric, target_value, deadline]
    additionalProperties: false
    properties:
      metric: { type: string }
      target_value: { type: number }
      deadline: { type: string, format: date-time }
  task:
    type: array
    minItems: 1
    items:
      type: object
      required: [task_id, description, sub_tasks]
      additionalProperties: false
      properties:
        task_id: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        sub_tasks: { type: array, items: { type: string } }
  sub_task:
    type: array
    minItems: 1
    items:
      type: object
      required: [sub_task_id, parent_task_id, description]
      additionalProperties: false
      properties:
        sub_task_id: { type: string, minLength: 1 }
        parent_task_id: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        tool_ref: { type: [string, "null"] }
        agent_ref: { type: [string, "null"] }
  dependency:
    type: array
    items:
      type: object
      required: [from, to, type]
      additionalProperties: false
      properties:
        from: { type: string }
        to: { type: string }
        type: { type: string, enum: [finish_to_start, must_precede] }
  priority:
    type: integer
    minimum: 1
    maximum: 10
  constraints:
    type: array
    minItems: 1
    items:
      type: object
      required: [constraint_id, type, expression]
      additionalProperties: false
      properties:
        constraint_id: { type: string }
        type:
          {
            type: string,
            enum: [cost_ceiling, time_ceiling, tool_allowlist, tenant_policy, token_ceiling],
          }
        expression: { type: string }
  execution_plan:
    type: object
    required: [ordered_steps, graph_ref]
    additionalProperties: false
    properties:
      ordered_steps: { type: array, items: { type: string }, minItems: 1 }
      graph_ref: { type: string }
  fallback:
    type: [object, "null"]
    additionalProperties: false
    properties:
      strategy:
        { type: string, enum: [alternate_plan, escalate_to_human, retry_with_relaxed_constraints] }
      fallback_plan_ref: { type: [string, "null"] }
  success_criteria:
    type: array
    minItems: 1
    items:
      type: object
      required: [criterion_id, metric, threshold, comparator]
      additionalProperties: false
      properties:
        criterion_id: { type: string }
        metric: { type: string }
        threshold: { type: number }
        comparator: { type: string, enum: [gte, lte, eq, gt, lt] }
  failure_criteria:
    type: array
    minItems: 1
    items:
      type: object
      required: [criterion_id, metric, threshold, comparator]
      additionalProperties: false
      properties:
        criterion_id: { type: string }
        metric: { type: string }
        threshold: { type: number }
        comparator: { type: string, enum: [gte, lte, eq, gt, lt] }
  model_ref:
    type: string
    minLength: 1
  max_replan_attempts:
    type: integer
    minimum: 0
    maximum: 10
  status:
    type: string
    enum: [draft, active, deprecated, retired]
