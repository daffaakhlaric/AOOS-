# Model Contract — YAML Schema
# Contract: contract.model v1.0.0
# See: contracts/model.contract.md

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://aos.platform/schemas/model.schema.yaml"
title: ModelContract
type: object
additionalProperties: false
required:
  - id
  - model_id
  - version
  - description
  - state
  - provider
  - model_name
  - capabilities
  - reasoning_level
  - context_window
  - cost
  - latency
  - availability
  - fallback
  - priority
  - routing_policy
  - tenant_scope
  - owner
properties:
  id:
    type: string
    format: uuid
  model_id:
    type: string
    pattern: "^model\\.[a-z0-9_]+\\.[a-z0-9_-]+$"
  version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
  description:
    type: string
    minLength: 10
  state:
    type: string
    enum: [draft, active, deprecated, retired]
  provider:
    type: string
    enum: [anthropic, openai, google, meta, mistral, azure_openai, self_hosted]
  model_name:
    type: string
    minLength: 1
  capabilities:
    type: array
    minItems: 1
    items:
      type: string
      enum:
        [
          text_generation,
          function_calling,
          vision,
          embedding,
          code_generation,
          reasoning,
          structured_output,
        ]
  reasoning_level:
    type: string
    enum: [none, low, medium, high]
  context_window:
    type: object
    required: [max_input_tokens, max_output_tokens]
    additionalProperties: false
    properties:
      max_input_tokens: { type: integer, minimum: 1 }
      max_output_tokens: { type: integer, minimum: 1 }
  cost:
    type: object
    required: [unit, currency]
    additionalProperties: false
    properties:
      unit: { type: string, enum: [per_token, per_call] }
      input_cost: { type: number, minimum: 0 }
      output_cost: { type: number, minimum: 0 }
      per_call_cost: { type: number, minimum: 0 }
      currency: { type: string, minLength: 3, maxLength: 3 }
  latency:
    type: object
    required: [p50_ms, p95_ms]
    additionalProperties: false
    properties:
      p50_ms: { type: integer, minimum: 1 }
      p95_ms: { type: integer, minimum: 1 }
  availability:
    type: object
    required: [sla_percent, regions]
    additionalProperties: false
    properties:
      sla_percent: { type: number, minimum: 0, maximum: 100 }
      regions:
        type: array
        items: { type: string }
        minItems: 1
  fallback:
    type: array
    items:
      type: string
      pattern: "^model\\.[a-z0-9_]+\\.[a-z0-9_-]+$"
  priority:
    type: integer
    minimum: 1
    maximum: 10
  routing_policy:
    type: object
    required: [tier, task_type_mapping_ref]
    additionalProperties: false
    properties:
      tier: { type: string, enum: [economy, standard, premium] }
      task_type_mapping_ref: { type: string, minLength: 1 }
  tenant_scope:
    type: string
    enum: [global, tenant_override_allowed, tenant_only]
  owner:
    type: string
    minLength: 1
  tags:
    type: array
    items: { type: string }
  metadata:
    type: object
