# Event Contract — YAML Schema
# Contract: contract.event v1.0.0
# See: contracts/event.contract.md

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://aos.platform/schemas/event.schema.yaml"
title: EventContract
type: object
additionalProperties: false
required:
  - event_id
  - event_name
  - schema_version
  - publisher
  - subscriber
  - payload_schema
  - priority
  - retry
  - dead_letter
  - trace_id
  - correlation_id
  - tenant_id
  - timestamp
properties:
  event_id:
    type: string
    format: uuid
  event_name:
    type: string
    pattern: "^[a-z][a-z0-9]*\\.[a-z][a-z0-9_]*$"
  schema_version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
  publisher:
    type: string
    minLength: 1
  subscriber:
    type: array
    items: { type: string }
  payload_schema:
    type: string
    minLength: 1
  payload:
    type: object
  priority:
    type: integer
    minimum: 1
    maximum: 10
  retry:
    type: object
    required: [max_attempts, backoff_strategy, backoff_base_ms]
    properties:
      max_attempts: { type: integer, minimum: 0, maximum: 10 }
      backoff_strategy: { type: string, enum: [fixed, linear, exponential] }
      backoff_base_ms: { type: integer, minimum: 100 }
  delay:
    type: string
    pattern: "^P(\\d+D|T\\d+[HMS])$"
  dead_letter:
    type: object
    required: [enabled]
    properties:
      enabled: { type: boolean }
      queue_ref: { type: string }
      max_retries: { type: integer, minimum: 0 }
      alert_required: { type: boolean }
  schedule:
    type: object
    properties:
      cron: { type: string, minLength: 1 }
      timezone: { type: string, minLength: 1 }
  trace_id:
    type: string
    format: uuid
  correlation_id:
    type: string
    format: uuid
  tenant_id:
    type: string
    format: uuid
  timestamp:
    type: string
    format: date-time
