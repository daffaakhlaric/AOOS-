# Workflow Contract — YAML Schema
# Contract: contract.workflow v1.0.0
# See: contracts/workflow.contract.md

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://aos.platform/schemas/workflow.schema.yaml"
title: WorkflowContract
type: object
additionalProperties: false
required:
  - workflow_id
  - version
  - nodes
  - edges
  - parallel_execution
  - retry_policy
  - rollback
  - timeout
  - priority
  - events
  - state_machine
  - metrics
  - cost_budget
  - status
properties:
  workflow_id:
    type: string
    pattern: "^workflow\\.[a-z][a-z0-9_]*$"
  version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
  nodes:
    type: array
    minItems: 1
    items:
      type: object
      required: [node_id, type, invokes, input_schema, output_schema, timeout, retry_policy]
      additionalProperties: false
      properties:
        node_id: { type: string, minLength: 1 }
        type:
          {
            type: string,
            enum:
              [tool_invocation, agent_invocation, human_checkpoint, condition, join, sub_workflow],
          }
        invokes: { type: string, description: "Tool ID, Agent ID, or sub-Workflow ID" }
        input_schema: { type: string }
        output_schema: { type: string }
        timeout: { type: string, pattern: "^PT\\d+[SMH]$" }
        retry_policy:
          type: object
          required: [max_attempts, backoff_strategy, backoff_base_ms]
          properties:
            max_attempts: { type: integer, minimum: 0, maximum: 10 }
            backoff_strategy: { type: string, enum: [fixed, linear, exponential] }
            backoff_base_ms: { type: integer, minimum: 100 }
        compensation: { type: [string, "null"] }
  edges:
    type: array
    minItems: 1
    items:
      type: object
      required: [from, to]
      additionalProperties: false
      properties:
        from: { type: string }
        to: { type: string }
        condition_ref: { type: [string, "null"] }
  conditions:
    type: array
    items:
      type: object
      required: [condition_id, expression, evaluated_on]
      additionalProperties: false
      properties:
        condition_id: { type: string }
        expression: { type: string }
        evaluated_on: { type: string }
  parallel_execution:
    type: object
    required: [enabled, max_concurrency, join_strategy]
    additionalProperties: false
    properties:
      enabled: { type: boolean }
      max_concurrency: { type: integer, minimum: 1 }
      join_strategy: { type: [string, "null"], enum: [wait_all, wait_any, wait_n, null] }
  retry_policy:
    type: object
    required: [max_attempts, backoff_strategy, backoff_base_ms]
    additionalProperties: false
    properties:
      max_attempts: { type: integer, minimum: 0, maximum: 10 }
      backoff_strategy: { type: string, enum: [fixed, linear, exponential] }
      backoff_base_ms: { type: integer, minimum: 100 }
  rollback:
    type: object
    required: [supported, strategy]
    additionalProperties: false
    properties:
      supported: { type: boolean }
      strategy: { type: string, enum: [saga, checkpoint_replay, none] }
  compensation:
    type: array
    items:
      type: object
      required: [node_id, compensation_action_ref]
      additionalProperties: false
      properties:
        node_id: { type: string }
        compensation_action_ref: { type: string }
  timeout:
    type: string
    pattern: "^PT\\d+[SMH]$"
  priority:
    type: integer
    minimum: 1
    maximum: 10
  events:
    type: object
    required: [publishes, subscribes]
    additionalProperties: false
    properties:
      publishes: { type: array, items: { type: string } }
      subscribes: { type: array, items: { type: string } }
  dependencies:
    type: array
    items: { type: string }
  state_machine:
    type: object
    required: [states, transitions, initial_state]
    additionalProperties: false
    properties:
      states:
        type: array
        items: { type: string, enum: [Created, Running, Paused, Failed, Completed, Compensated] }
      transitions:
        type: array
        items:
          type: object
          required: [from, to, on]
          properties:
            from: { type: string }
            to: { type: string }
            on: { type: string }
      initial_state: { type: string, enum: [Created] }
  metrics:
    type: array
    items: { type: string }
  cost_budget:
    type: object
    required: [amount, currency]
    additionalProperties: false
    properties:
      amount: { type: number, minimum: 0 }
      currency: { type: string, minLength: 3, maxLength: 3 }
  human_checkpoints:
    type: array
    items:
      type: object
      required: [node_id, prompt, approval_required]
      additionalProperties: false
      properties:
        node_id: { type: string }
        prompt: { type: string }
        approval_required: { type: boolean }
  status:
    type: string
    enum: [draft, active, deprecated, retired]
