# Logging Contract — YAML Schema
# Contract: contract.logging v1.0.0
# See: contracts/logging.contract.md

$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://aos.platform/schemas/logging.schema.yaml"
title: LoggingContract
type: object
additionalProperties: false
required:
  - log_id
  - trace_id
  - span_id
  - tenant_id
  - emitting_component
  - severity
  - timestamp
  - message
  - pii_redacted
  - retention_class
properties:
  log_id:
    type: string
    format: uuid
  trace_id:
    type: string
    format: uuid
  span_id:
    type: string
    format: uuid
  correlation_id:
    type: string
    format: uuid
  tenant_id:
    type: string
    minLength: 1
  emitting_component:
    type: string
    minLength: 1
  severity:
    type: string
    enum: [DEBUG, INFO, WARN, ERROR, CRITICAL]
  timestamp:
    type: string
    format: date-time
  message:
    type: string
    minLength: 1
  context:
    type: object
    properties:
      prompt_version: { type: string }
      model: { type: string }
      input_summary: { type: string }
      output_summary: { type: string }
      confidence: { type: number, minimum: 0, maximum: 1 }
    additionalProperties: false
  metadata:
    type: object
    additionalProperties: true
  pii_redacted:
    type: boolean
  alert_dispatched:
    type: boolean
  retention_class:
    type: string
    enum: [standard, extended_compliance, ephemeral_debug]
